astar_lbfgs_path_planner:
  ros__parameters:
    frame_id: "world"

    # --- Node I/O ---
    topics:
      occupancy_map: "/esdf_map/occupancy_inflate"
      esdf_map: "/esdf_map/esdf_distance"
      clicked_point: "/clicked_point"
      waypoints: "/planning/waypoints"

    # map.source: "binary" loads package-relative maps/; "topic" subscribes to both map topics.
    map:
      source: "binary"
      # Must match the saved voxel resolution. origin/size used when auto_bounds is false or in topic mode.
      resolution: 0.15
      origin_x: -10.0
      origin_y: -10.0
      origin_z: -1.0
      size_x: 20.0
      size_y: 20.0
      size_z: 5.0
      # occupancy_inflate = occupied centers; esdf_distance intensity = real ESDF distance.
      unknown_as_occupied: false
      clear_before_integrate: true
      skip_repeated_occupancy_with_same_point_count: true
      skip_repeated_esdf_with_same_point_count: true

    binary_map:
      directory: "maps"
      occupancy_filename: "occupancy.bin"
      esdf_filename: "esdf.bin"
      fallback_to_topic: true
      # Keep false so mesh blocks align with asr_sdm_esdf_map; enable only for bins with different bounds.
      auto_bounds: false
      auto_bounds_padding: 1.0

    visualization:
      publish_occupied_map: true
      occupied_map_topic: "/esdf_map/occupied_map"
      occupied_map_alpha: 0.85
      occupied_map_stride: 1
      occupied_map_mesh_resolution: 0.30
      # Kept for parity with asr_sdm_esdf_map; mesh faces do not use it today.
      occupied_map_mesh_max_height_gap: 0.60
      # Match asr_sdm_esdf_map so /esdf_map/occupied_map looks identical.
      ground_height: -1.0
      visualization_truncate_height: 3.0
      occupied_map_publish_period_sec: 2.0
      corridor_marker_topic: "/planning/safe_corridor"
      corridor_marker_alpha: 0.1

    # --- Selection (node click handling + GuidancePlanner projection) ---
    selection:
      # Node: RViz Publish Point → /clicked_point
      clicked_point_use_msg_z: true
      default_planning_z: 0.5
      # GuidancePlanner: reject unsafe optimized paths; project clicks along ESDF gradient.
      use_optimized_only_if_safe: true
      project_start_goal_to_safe: true
      # Max gradient travel distance (m), not a full 3D voxel search radius.
      safe_point_search_radius: 4.0

    # --- GuidancePlanner pipeline ---
    astar:
      heuristic_weight: 1.0
      extra_clearance: 0.0
      max_expansions: 300000
      nearest_free_search_radius: 10
      allow_diagonal: true

    # Bubble-Planner-style spheres; A* only supplies guide points.
    corridor:
      enabled: true
      batch_sample_count: 80
      max_spheres: 80
      # r = ESDF(center) - drone_radius - safety_margin; maps are already inflated → drone_radius 0.
      drone_radius: 0.0
      safety_margin: 0.1
      min_radius: 0.1
      max_radius: 6.0
      min_overlap_volume: 0.00001
      radius_weight: 1.0
      overlap_weight: 4.0
      sample_axis_scale: 0.3333333333333333
      sample_lateral_scale: 2.0
      random_seed: 7
      deterministic_sampling: true

    optimizer:
      enabled: true
      max_iterations: 120
      max_control_points: 80
      epsilon: 0.0001
      smooth_weight: 1.0
      length_weight: 0.05
      obstacle_weight: 12.0
      guide_weight: 0.08
      # ESDF already from inflated occupancy; keep small to avoid stacking clearance.
      safe_distance: 0.20
      validity_check_step: 0.05
      extra_clearance: 0.0
      corridor_weight: 60.0
