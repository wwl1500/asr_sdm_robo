/**:
  ros__parameters:
    fsm:
      flight_type: "MANUAL_TARGET"
      # Same topic as asr_sdm_control_manager: RViz 2D Pose Estimate resets both.
      initialpose_topic: /control/initial_pose
      thresh_replan: 0.5
      thresh_no_replan: 2.0
      waypoint_num: 2
      waypoint0_x: 19.0
      waypoint0_y: 0.0
      waypoint0_z: 1.0
      waypoint1_x: -19.0
      waypoint1_y: 0.0
      waypoint1_z: 1.0
      waypoint2_x: 0.0
      waypoint2_y: 19.0
      waypoint2_z: 1.0
      act_map: false

    esdf_map:
      resolution: 0.1
      map_size_x: 40.0
      map_size_y: 40.0
      map_size_z: 10.0
      local_update_range_x: 5.5
      local_update_range_y: 5.5
      local_update_range_z: 4.5
      obstacles_inflation: 0.099
      local_bound_inflate: 0.5
      local_map_margin: 50
      ground_height: -5.0
      cx: 321.04638671875
      cy: 243.44969177246094
      fx: 387.229248046875
      fy: 387.229248046875
      use_depth_filter: true
      depth_filter_tolerance: 0.15
      depth_filter_maxdist: 4.5
      depth_filter_mindist: 0.2
      depth_filter_margin: 2
      k_depth_scaling_factor: 1000.0
      skip_pixel: 3
      p_hit: 0.65
      p_miss: 0.35
      p_min: 0.12
      p_max: 0.90
      p_occ: 0.80
      min_ray_length: 0.5
      max_ray_length: 4.5
      esdf_slice_height: 0.3
      visualization_truncate_height: 2.5
      virtual_ceil_height: 3.0
      show_occ_time: false
      show_esdf_time: false
      pose_type: 1
      frame_id: "world"
      simulation_cloud_topic: "/asr_sdm_map_generator/global_cloud"
      simulation_odom_topic: "/visual_slam/odom"
      # Enable both simulation point-cloud and odometry subscriptions.
      enable_simulation_cloud_odom: true

    manager:
      max_vel: 0.4
      max_acc: 0.4
      max_jerk: 0.2
      dynamic_environment: 0
      local_segment_length: 6.0
      clearance_threshold: 0.2
      control_points_distance: 0.3
      use_guidance_planner: true
      use_topo_path: true
      use_optimization: true
      # The head is driven as a nonholonomic body: yaw and pitch follow the
      # trajectory tangent, so their limits constrain the position trajectory.
      nonholonomic: true
      # Mirror the rate limits enforced by asr_sdm_control_manager.
      max_yaw_rate: 0.2
      max_pitch_rate: 0.2
      min_vel: 0.1
      # Largest factor by which refinement may stretch the duration of a local
      # segment. A topological detour is longer than the segment it replaces but
      # inherits its duration, so it starts out over-speed and needs the extra
      # time. Set to 1.01 to leave the timing almost untouched.
      max_time_lengthen_ratio: 1.5

    # 3D Dubins front end used when manager.use_guidance_planner is true.
    # Turning radii match max_vel / max_yaw_rate and max_vel / max_pitch_rate.
    guidance_planner:
      dubins_path_3d:
        yaw_radius: 1.0
        pitch_radius: 1.0
        sample_ds: 0.1
        margin: 0.2
        position_tol: 0.05
        tight_turn_radius: -1.0
        location_samples: 15
        heading_samples: 15
        num_threads: 0

    topo_prm:
      sample_inflate_x: 1.0
      sample_inflate_y: 3.0
      sample_inflate_z: 3.0
      clearance: 0.3
      max_sample_time: 0.005
      max_sample_num: 2000
      max_raw_path: 300
      max_raw_path2: 25
      short_cut_num: 1
      reserve_num: 6
      ratio_to_short: 5.5
      parallel_shortcut: true

    optimization:
      lambda1: 10.0              # smoothness
      lambda2: 3.0               # clearance
      lambda3: 1.0               # vel / acc feasibility
      lambda4: 0.001             # unused (endpoint)
      lambda5: 1.5               # topo guide
      lambda6: 10.0              # unused (visibility)
      lambda7: 20.0              # waypoints / refine anchor
      lambda_yaw_rate: 15.0      # with manager.max_yaw_rate
      lambda_pitch_rate: 15.0    # with manager.max_pitch_rate
      lambda_min_vel: 0.1        # with manager.min_vel
      dist0: 0.3                 # clearance hinge [m]
      max_iteration_num1: 30     # guide-phase eval budget
      max_iteration_num2: 300    # full / refine eval budget
      max_iteration_time1: 0.003 # guide-phase time [s]
      max_iteration_time2: 0.005 # full / refine time [s]
      order: 3                   # B-spline degree

    heading_planner:
      yaw_diff: 0.08726646
      half_vert_num: 3
      lambda1: 2.0
      lambda2: 1.0
      max_yaw_rate: 1.04719753
      w: 10.0

    traj_server:
      ros__parameters:
        traj_server:
          time_forward: 1.5
          initialpose_topic: /control/initial_pose
